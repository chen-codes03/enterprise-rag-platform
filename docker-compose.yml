services:
  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    # 不对外暴露端口，仅 backend 容器内部网络访问
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===== 后端 API（Python + FastAPI）=====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_PERSIST_DIR=data/chroma
      - CHROMA_COLLECTION=enterprise_kb
      - APP_ENV=prod
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # ===== 前端（Vue 3 + Nginx）=====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
