services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # 避免与本机 6379 冲突
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8010:8000"  # 避免与本机 8000 冲突
    env_file:
      - .env  # 从 .env 文件加载真实大模型 API key 等配置（.env 已被 .gitignore 忽略）
    environment:
      # ===== 大模型：默认 fake 离线演示；在 .env 中设 MODEL_PROVIDER=deepseek + DEEPSEEK_API_KEY 启用真实大模型 =====
      - EMBEDDING_PROVIDER=fake
      - EMBEDDING_DIMENSION=32
      # ===== 鉴权（演示用，生产请通过 .env 注入强密钥）=====
      - API_KEY=sk-rag-demo-key-change-me
      # ===== 基础设施 =====
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_PERSIST_DIR=data/chroma
      - CHROMA_COLLECTION=enterprise_kb
      - APP_ENV=prod
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  redis-data:
